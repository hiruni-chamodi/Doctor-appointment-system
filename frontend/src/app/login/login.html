<div class="min-h-screen flex font-sans bg-white">

  <!-- Left Side: Image & Branding (Hidden on small screens) -->
  <div class="hidden lg:flex lg:w-1/2 relative bg-[#0A3F35] overflow-hidden">

    <!-- Dark Green Overlay for text readability -->
    <div class="absolute inset-0 bg-emerald-900/80 z-10"></div>

    <!-- Background Image -->
    <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=2053&auto=format&fit=crop"
         alt="Clinic Waiting Room"
         class="absolute inset-0 w-full h-full object-cover mix-blend-overlay">

    <!-- Branding Content -->
    <div class="relative z-20 flex flex-col justify-center p-16 h-full max-w-2xl">
      <h1 class="text-5xl font-bold text-white mb-6 tracking-tight">Zenith Medical</h1>
      <p class="text-xl text-emerald-50 leading-relaxed">Experience healthcare reimagined. A serene, seamless journey to better health.</p>
    </div>

  </div>

  <!-- Right Side: Login Form -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-16">
    <div class="w-full max-w-md">

      <div class="mb-10">
        <h2 class="text-3xl font-bold text-primary mb-2">Welcome Back</h2>
        <p class="text-on-surface-variant">Sign in to access your Zenith Medical account.</p>
      </div>

      <form>
        <div class="grid grid-cols-1 gap-6 mb-8">
          <div>
            <label class="block font-medium text-sm text-on-surface mb-2" for="email">Email Address</label>
            <input [(ngModel)]="email" name="email" class="w-full bg-white border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-on-surface" id="email" placeholder="jane.doe@example.com" type="email"/>
          </div>

          <div>
            <label class="block font-medium text-sm text-on-surface mb-2" for="password">Password</label>
            <input [(ngModel)]="password" name="password" class="w-full bg-white border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-on-surface" id="password" placeholder="••••••••" type="password"/>
          </div>
        </div>

        @if (errorMessage) {
          <p class="text-red-600 text-sm font-medium mb-6">{{ errorMessage }}</p>
        }

        <button (click)="submitLogin()" [disabled]="isSubmitting" class="w-full px-8 py-3 rounded-lg font-medium text-white bg-primary hover:bg-opacity-90 transition-colors shadow-sm flex items-center justify-center gap-2 disabled:opacity-60" type="button">
          {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
          <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </button>

        <p class="text-center text-sm text-on-surface-variant mt-8">
          New here?
          <a routerLink="/register" class="font-medium text-primary hover:underline">Create an account</a>
        </p>
      </form>

    </div>
  </div>

</div>
