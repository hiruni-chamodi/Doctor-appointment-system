<div class="min-h-screen relative flex items-center justify-center font-sans p-6 lg:p-10 overflow-hidden bg-[#0A3F35]">

  <!-- Background Photo (blurred) -->
  <img
    src="/image.png"
    alt=""
    class="absolute inset-0 w-full h-full object-cover scale-110 blur-sm"
  />
  <div class="absolute inset-0 bg-gradient-to-br from-[#0A3F35]/70 via-[#0A3F35]/55 to-emerald-900/50"></div>

  <!-- Decorative Crosses -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden text-white">
    <svg class="absolute -top-6 left-10 w-24 h-24 opacity-10 rotate-6" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v5h5v6h-5v9H9v-9H2V7h7V2Z" /></svg>
    <svg class="absolute top-1/3 left-4 w-12 h-12 opacity-10 -rotate-12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v5h5v6h-5v9H9v-9H2V7h7V2Z" /></svg>
    <svg class="absolute top-10 right-16 w-16 h-16 opacity-10 rotate-12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v5h5v6h-5v9H9v-9H2V7h7V2Z" /></svg>
    <svg class="absolute bottom-16 right-8 w-28 h-28 opacity-10 -rotate-6" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v5h5v6h-5v9H9v-9H2V7h7V2Z" /></svg>
    <svg class="absolute bottom-10 left-1/4 w-10 h-10 opacity-10 rotate-3" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v5h5v6h-5v9H9v-9H2V7h7V2Z" /></svg>
  </div>

  <!-- Main Card -->
  <div class="relative z-20 w-full max-w-5xl">
    <div class="grid grid-cols-1 md:grid-cols-[1fr_1.3fr] gap-5">

      <!-- Promo Strip (tinted glass) -->
      <div class="relative hidden md:flex flex-col justify-center items-start gap-6 overflow-hidden rounded-3xl border border-white/25 shadow-2xl bg-[#0A3F35]/50 backdrop-blur-2xl backdrop-saturate-150 p-8">
        <div class="pointer-events-none absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-white/25 to-transparent"></div>
        <h2 class="text-2xl font-bold text-white leading-snug">Welcome to<br />Zenith Medical</h2>
        <button
          type="button"
          class="px-5 py-2.5 rounded-full bg-white/15 hover:bg-white/25 transition text-sm font-semibold text-white border border-white/25 backdrop-blur-sm"
        >
          Connect with Care
        </button>
      </div>

      <!-- Sign In (glass) -->
      <div class="relative overflow-hidden rounded-3xl border border-white/40 shadow-2xl bg-white/40 backdrop-blur-2xl backdrop-saturate-150 p-8 sm:p-10 flex flex-col justify-center">
        <div class="pointer-events-none absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-white/60 to-transparent"></div>
        <h3 class="text-xl font-bold text-[#0A3F35] mb-1">Welcome Back</h3>
        <p class="text-sm text-gray-700 mb-6">Sign in to access your Zenith Medical account.</p>

        <form class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1.5" for="email">Email Address</label>
            <input
              [(ngModel)]="email"
              name="email"
              id="email"
              type="email"
              placeholder="jane.doe@example.com"
              class="w-full bg-white/60 border border-white/70 backdrop-blur-sm rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#0A3F35] focus:border-transparent transition"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1.5" for="password">Password</label>
            <input
              [(ngModel)]="password"
              name="password"
              id="password"
              type="password"
              placeholder="••••••••"
              class="w-full bg-white/60 border border-white/70 backdrop-blur-sm rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#0A3F35] focus:border-transparent transition"
            />
          </div>

          @if (errorMessage) {
            <p class="text-red-600 text-xs font-semibold">{{ errorMessage }}</p>
          }

          <button
            (click)="submitLogin()"
            [disabled]="isSubmitting"
            type="button"
            class="w-full mt-2 px-6 py-2.5 rounded-lg font-semibold text-white bg-[#0A3F35] hover:bg-emerald-900 transition shadow-sm flex items-center justify-center gap-2 disabled:opacity-60"
          >
            {{ isSubmitting ? 'Signing In…' : 'Sign In' }}
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
          </button>

          <p class="text-center text-xs text-gray-700 pt-2">
            New here?
            <a routerLink="/register" class="font-semibold text-[#0A3F35] hover:underline">Create an account</a>
          </p>
        </form>
      </div>

    </div>

    <!-- Bottom Links -->
    <div class="flex items-center justify-center gap-8 mt-6 text-emerald-50/70 text-xs font-medium">
      <a routerLink="/help-center" class="hover:text-white transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="1.8" /><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7v.3" stroke-width="1.8" stroke-linecap="round" /><circle cx="12" cy="16.5" r="0.5" fill="currentColor" /></svg>
        Help Center
      </a>
      <a routerLink="/" class="hover:text-white transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m0-8H5a2 2 0 00-2 2v12a2 2 0 002 2h2" /></svg>
        Exit
      </a>
    </div>
  </div>

</div>
