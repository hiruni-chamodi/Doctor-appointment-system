<div class="min-h-screen bg-slate-50 p-8 lg:p-12 font-sans">

  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-[#0A3F35] mb-2">My Appointments</h1>
      <p class="text-gray-500 text-lg">Manage your upcoming visits and view past records.</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="border-b border-gray-200 mb-8">
      <nav class="-mb-px flex gap-8">
        <button class="border-b-2 border-[#0A3F35] text-[#0A3F35] whitespace-nowrap py-4 px-1 font-bold text-sm">
          Upcoming (2)
        </button>
        <button class="border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 font-medium text-sm transition">
          Past Appointments
        </button>
        <button class="border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 font-medium text-sm transition">
          Canceled
        </button>
      </nav>
    </div>

    <!-- Appointments List -->
    <div class="space-y-6">

      <!-- Appointment Card 1 -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 flex flex-col md:flex-row gap-6 lg:gap-8 items-start md:items-center hover:shadow-md transition">

        <!-- Date Block -->
        <div class="bg-slate-50 rounded-xl p-4 text-center min-w-[100px] border border-gray-100 shrink-0">
          <div class="text-sm font-bold text-gray-500 uppercase tracking-wider">Nov</div>
          <div class="text-3xl font-bold text-gray-900 my-1">14</div>
          <div class="text-xs font-bold text-gray-400">TUESDAY</div>
        </div>

        <!-- Doctor & Details -->
        <div class="flex-1 w-full">
          <div class="flex items-center gap-3 mb-2">
            <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold tracking-wide">Confirmed</span>
            <span class="text-gray-900 font-bold flex items-center gap-1.5">
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              10:30 AM
            </span>
          </div>

          <h3 class="text-2xl font-bold text-gray-900 mb-1">Dr. Sarah Jenkins</h3>
          <p class="text-[#0A3F35] font-medium text-sm mb-3">Cardiology Consultation</p>

          <div class="flex items-center gap-2 text-sm text-gray-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
            Zenith Medical Center • Room 402
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row md:flex-col gap-3 w-full md:w-auto shrink-0 mt-4 md:mt-0">
          <button class="w-full bg-white border border-gray-200 text-gray-700 px-6 py-2.5 rounded-xl font-bold hover:bg-gray-50 transition shadow-sm text-sm">Reschedule</button>
          <button class="w-full bg-red-50 text-red-600 px-6 py-2.5 rounded-xl font-bold hover:bg-red-100 transition text-sm">Cancel Visit</button>
        </div>

      </div>

      <!-- Appointment Card 2 -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 flex flex-col md:flex-row gap-6 lg:gap-8 items-start md:items-center hover:shadow-md transition">

        <!-- Date Block -->
        <div class="bg-slate-50 rounded-xl p-4 text-center min-w-[100px] border border-gray-100 shrink-0">
          <div class="text-sm font-bold text-gray-500 uppercase tracking-wider">Dec</div>
          <div class="text-3xl font-bold text-gray-900 my-1">02</div>
          <div class="text-xs font-bold text-gray-400">FRIDAY</div>
        </div>

        <!-- Doctor & Details -->
        <div class="flex-1 w-full">
          <div class="flex items-center gap-3 mb-2">
            <span class="bg-orange-100 text-orange-800 px-3 py-1 rounded-full text-xs font-bold tracking-wide">Pending</span>
            <span class="text-gray-900 font-bold flex items-center gap-1.5">
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              02:00 PM
            </span>
          </div>

          <h3 class="text-2xl font-bold text-gray-900 mb-1">Dr. Marcus Vance</h3>
          <p class="text-[#0A3F35] font-medium text-sm mb-3">Annual Physical Checkup</p>

          <div class="flex items-center gap-2 text-sm text-gray-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
            Zenith North Clinic • Suite 110
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row md:flex-col gap-3 w-full md:w-auto shrink-0 mt-4 md:mt-0">
          <button class="w-full bg-white border border-gray-200 text-gray-700 px-6 py-2.5 rounded-xl font-bold hover:bg-gray-50 transition shadow-sm text-sm">Reschedule</button>
          <button class="w-full bg-red-50 text-red-600 px-6 py-2.5 rounded-xl font-bold hover:bg-red-100 transition text-sm">Cancel Visit</button>
        </div>

      </div>

    </div>
  </div>
</div>
