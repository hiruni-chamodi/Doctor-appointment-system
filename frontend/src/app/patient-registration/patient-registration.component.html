<div class="min-h-screen relative flex items-center justify-center font-sans p-6 lg:p-10 overflow-hidden bg-[#0A3F35]">

  <!-- Background Photo (blurred) -->
  <img
    src="/image.png"
    alt=""
    class="absolute inset-0 w-full h-full object-cover scale-110 blur-sm"
  />
  <div class="absolute inset-0 bg-gradient-to-br from-[#0A3F35]/70 via-[#0A3F35]/55 to-emerald-900/50"></div>

  <!-- Decorative Crosses -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden text-white">
    <svg class="absolute -top-6 left-10 w-24 h-24 opacity-10 rotate-6" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v5h5v6h-5v9H9v-9H2V7h7V2Z" /></svg>
    <svg class="absolute top-1/3 left-4 w-12 h-12 opacity-10 -rotate-12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v5h5v6h-5v9H9v-9H2V7h7V2Z" /></svg>
    <svg class="absolute top-10 right-16 w-16 h-16 opacity-10 rotate-12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v5h5v6h-5v9H9v-9H2V7h7V2Z" /></svg>
    <svg class="absolute bottom-16 right-8 w-28 h-28 opacity-10 -rotate-6" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v5h5v6h-5v9H9v-9H2V7h7V2Z" /></svg>
    <svg class="absolute bottom-10 left-1/4 w-10 h-10 opacity-10 rotate-3" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v5h5v6h-5v9H9v-9H2V7h7V2Z" /></svg>
  </div>

  <!-- Cancel (top-right) -->
  <a routerLink="/login" class="absolute top-8 right-8 lg:top-12 lg:right-12 z-20 text-white/80 hover:text-white transition flex items-center gap-2 text-sm font-medium">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    Cancel
  </a>

  <!-- Main Card -->
  <div class="relative z-20 w-full max-w-2xl">
    <div class="relative rounded-3xl border border-white/40 shadow-2xl bg-white/40 backdrop-blur-2xl backdrop-saturate-150 p-8 sm:p-10 max-h-[85vh] overflow-y-auto">
      <div class="pointer-events-none absolute inset-x-0 top-0 h-28 rounded-t-3xl bg-gradient-to-b from-white/60 to-transparent"></div>

      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-[#0A3F35] mb-1">Create Your Account</h1>
        <p class="text-sm text-gray-700">Welcome to Zenith Medical. Let's get you set up.</p>
      </div>

      <form class="space-y-6">
        <div>
          <p class="text-xs font-semibold text-gray-700 mb-2">Account Type</p>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" (click)="role = 'PATIENT'" [class]="roleButtonClasses('PATIENT')">I'm a Patient</button>
            <button type="button" (click)="role = 'DOCTOR'" [class]="roleButtonClasses('DOCTOR')">I'm a Doctor</button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1.5" for="firstName">First Name</label>
            <input
              [(ngModel)]="firstName"
              name="firstName"
              id="firstName"
              type="text"
              placeholder="Jane"
              class="w-full bg-white/60 border border-white/70 backdrop-blur-sm rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#0A3F35] focus:border-transparent transition"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1.5" for="lastName">Last Name</label>
            <input
              [(ngModel)]="lastName"
              name="lastName"
              id="lastName"
              type="text"
              placeholder="Doe"
              class="w-full bg-white/60 border border-white/70 backdrop-blur-sm rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#0A3F35] focus:border-transparent transition"
            />
          </div>

          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-gray-700 mb-1.5" for="email">Email Address</label>
            <input
              [(ngModel)]="email"
              name="email"
              id="email"
              type="email"
              placeholder="jane.doe@example.com"
              class="w-full bg-white/60 border border-white/70 backdrop-blur-sm rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#0A3F35] focus:border-transparent transition"
            />
          </div>

          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-gray-700 mb-1.5" for="password">Password</label>
            <input
              [(ngModel)]="password"
              name="password"
              id="password"
              type="password"
              placeholder="••••••••"
              class="w-full bg-white/60 border border-white/70 backdrop-blur-sm rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#0A3F35] focus:border-transparent transition"
            />
          </div>

          @if (role === 'DOCTOR') {
            <div class="sm:col-span-2">
              <label class="block text-xs font-semibold text-gray-700 mb-1.5" for="specialty">Specialty</label>
              <input
                [(ngModel)]="specialty"
                name="specialty"
                id="specialty"
                type="text"
                placeholder="Cardiology"
                class="w-full bg-white/60 border border-white/70 backdrop-blur-sm rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#0A3F35] focus:border-transparent transition"
              />
            </div>
          }
        </div>

        @if (errorMessage) {
          <p class="text-red-600 text-xs font-semibold">{{ errorMessage }}</p>
        }

        <button
          (click)="submitRegistration()"
          [disabled]="isSubmitting"
          type="button"
          class="w-full px-6 py-2.5 rounded-lg font-semibold text-white bg-[#0A3F35] hover:bg-emerald-900 transition shadow-sm flex items-center justify-center gap-2 disabled:opacity-60"
        >
          {{ isSubmitting ? 'Creating Account…' : 'Submit Registration' }}
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
        </button>

        <p class="text-center text-xs text-gray-700">
          Already have an account?
          <a routerLink="/login" class="font-semibold text-[#0A3F35] hover:underline">Sign in</a>
        </p>
      </form>
    </div>
  </div>

</div>
