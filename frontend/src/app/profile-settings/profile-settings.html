<div class="min-h-screen bg-slate-50 p-8 lg:p-12 font-sans pb-20">
  
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-10">
      <h1 class="text-4xl font-bold text-[#0A3F35] mb-2">Profile & Settings</h1>
      <p class="text-gray-500 text-lg">Manage your personal information and account preferences.</p>
    </div>

    <form class="space-y-8">
      
      <!-- Section 1: Personal Information -->
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold text-gray-900 mb-6 border-b border-gray-100 pb-4">Personal Information</h2>
        
        <!-- Avatar Upload (Visual only) -->
        <div class="flex items-center gap-6 mb-8">
          <img src="https://ui-avatars.com/api/?name=Hiruni+Chamodi&background=0A3F35&color=fff&size=128" class="w-20 h-20 rounded-full object-cover shadow-sm" alt="Profile Photo">
          <div>
            <button type="button" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-gray-50 transition shadow-sm mb-2">Change Photo</button>
            <p class="text-xs text-gray-500">JPG, GIF or PNG. Max size of 2MB.</p>
          </div>
        </div>

        <!-- Form Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
            <input type="text" value="Hiruni" class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0A3F35] focus:bg-white text-gray-900 outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
            <input type="text" value="Chamodi" class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0A3F35] focus:bg-white text-gray-900 outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
            <input type="email" value="hiruni@example.com" class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0A3F35] focus:bg-white text-gray-900 outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
            <input type="tel" value="+94 77 123 4567" class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0A3F35] focus:bg-white text-gray-900 outline-none transition">
          </div>
        </div>
      </div>

      <!-- Section 2: Emergency Contact -->
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold text-gray-900 mb-6 border-b border-gray-100 pb-4">Emergency Contact</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
            <input type="text" placeholder="Contact Name" class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0A3F35] focus:bg-white text-gray-900 outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Relationship</label>
            <input type="text" placeholder="e.g. Parent, Sibling" class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0A3F35] focus:bg-white text-gray-900 outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
            <input type="tel" placeholder="+94 XX XXX XXXX" class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0A3F35] focus:bg-white text-gray-900 outline-none transition">
          </div>
        </div>
      </div>

      <!-- Section 3: Insurance Information -->
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold text-gray-900 mb-6 border-b border-gray-100 pb-4">Insurance Details</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Insurance Provider</label>
            <input type="text" placeholder="e.g. Ceylinco, Sri Lanka Insurance" class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0A3F35] focus:bg-white text-gray-900 outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Member ID / Policy Number</label>
            <input type="text" placeholder="Policy ID" class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0A3F35] focus:bg-white text-gray-900 outline-none transition">
          </div>
        </div>
      </div>

      <!-- Save Actions -->
      <div class="flex justify-end gap-4 pt-4">
        <button type="button" class="bg-white border border-gray-200 text-gray-700 px-6 py-3 rounded-xl font-bold hover:bg-gray-50 transition shadow-sm">Cancel</button>
        <button type="submit" class="bg-[#0A3F35] text-white px-8 py-3 rounded-xl font-bold hover:bg-emerald-900 transition shadow-md">Save Changes</button>
      </div>

    </form>
  </div>
</div>
